<body class="project-page rdv-page">
<div class="noise"></div>
<header class="project-nav">
  <a class="project-home" href="../index.html">ACCUEIL</a>
  <a class="project-brand" href="../index.html">WALYDNAFI</a>
  <a class="project-all" href="../index.html#contact">← RETOUR</a>
</header>
<main class="project-layout rdv-layout">
  <section class="rdv-copy">
    <h1 class="project-title">PRENDRE<br>RENDEZ-VOUS</h1>
    <div class="project-description">CHOISISSEZ DIRECTEMENT UN CRÉNEAU POUR ÉCHANGER AUTOUR DE VOTRE PROJET.</div>
  </section>

  <section class="rdv-calendar is-calendly-loading" aria-label="Réservation Calendly" aria-busy="true">
    <div class="calendly-inline-widget" data-url="https://calendly.com/nafiwalydpro/30min" style="min-width:320px;height:760px;"></div>
<div class="calendly-loading" aria-hidden="true">CHARGEMENT DES CRÉNEAUX…</div>
    <noscript>Veuillez activer JavaScript pour afficher le calendrier de réservation.</noscript>
  </section>
</main>
<script>
window.addEventListener("message", function(event) {
  if (event.origin === "https://calendly.com" &&
      event.data &&
      event.data.event === "calendly.page_viewed") {
    var box = document.querySelector(".rdv-calendar");
    if (box) {
      box.classList.remove("is-calendly-loading");
      box.setAttribute("aria-busy", "false");
    }
  }
});
</script>
<script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async crossorigin="anonymous"></script>
